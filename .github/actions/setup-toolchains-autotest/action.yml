name: Setup Incant C++ Toolchain AutoTest
description: Prepares one complete toolchain environment and builds the AutoTest apphost.

inputs:
  profile:
    description: Environment profile prepared by this action.
    required: true

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x
        dotnet-quality: ga

    - name: Restore toolchain cache
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: build/toolchains
        key: toolchains-v3-${{ runner.os }}-${{ runner.arch }}-${{ inputs.profile }}-ndk25.2.9519653-27.2.12479018-emscripten3.1.64-6.0.9-wasi33.0-34.0-wasmtime45.0.0-${{ hashFiles('.github/actions/setup-toolchains-autotest/**/*.mjs') }}

    - name: Prepare environment
      shell: bash
      env:
        INCANT_SETUP_PROFILE: ${{ inputs.profile }}
      run: |
        node "$GITHUB_WORKSPACE/.github/actions/setup-toolchains-autotest/prepare-environment.mjs" \
          --profile "$INCANT_SETUP_PROFILE" \
          --workspace "$GITHUB_WORKSPACE" \
          --output-path "$GITHUB_WORKSPACE/build/toolchain-environments/$INCANT_SETUP_PROFILE.json" \
          --toolchain-root "$GITHUB_WORKSPACE/build/toolchains"
