name: Setup Incant C++ Toolchain AutoTest
description: Prepares one complete toolchain environment and builds the AutoTest apphost.

inputs:
  profile:
    description: Environment profile prepared by this action.
    required: true

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x
        dotnet-quality: ga

    - name: Restore toolchain cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: build/toolchains
        key: toolchains-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.profile }}-ndk25.2.9519653-27.2.12479018-emscripten3.1.64-6.0.9-wasi33.0-34.0-wasmtime45.0.0-${{ hashFiles('.github/actions/setup-toolchains-autotest/Prepare-Environment.ps1') }}

    - name: Prepare environment
      shell: pwsh
      run: >
        & "${{ github.workspace }}/.github/actions/setup-toolchains-autotest/Prepare-Environment.ps1"
        -Profile "${{ inputs.profile }}"
        -OutputPath "${{ github.workspace }}/build/toolchain-environments/${{ inputs.profile }}.json"
        -ToolchainRoot "${{ github.workspace }}/build/toolchains"

    - name: Build AutoTest
      shell: pwsh
      run: |
        dotnet restore Tests/Incant.AutoTest.CppToolchain/Incant.AutoTest.CppToolchain.csproj
        dotnet build Tests/Incant.AutoTest.CppToolchain/Incant.AutoTest.CppToolchain.csproj --configuration Release --no-restore

        $appHostDirectory = (Resolve-Path 'build/bin/Incant.AutoTest.CppToolchain/release').Path
        $manifest = (Resolve-Path 'build/toolchain-environments/${{ inputs.profile }}.json').Path
        $appHostDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "INCANT_AUTOTEST_ENVIRONMENT=$manifest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
